# Serves the built React app and forwards the API paths to the gateway (same origin, no CORS).
# In production Caddy sends the API paths straight to the gateway (see deploy/Caddyfile), so the
# gateway still sees the real client IP for its /auth rate limit; the proxy block below is for
# development and for running the stack without Caddy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so nginx resolves the gateway at request time (same trick as the gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/(auth|wallets|transfers|admin|notifications)(/|$) {
        set $upstream http://gateway:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app shell must never be cached, or users keep an old bundle after a deploy.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
