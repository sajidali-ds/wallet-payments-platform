# Included in every location that serves the app: nginx drops server-level add_header lines in
# any location that has its own add_header, so the headers live in one snippet instead.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
# The app loads nothing from other origins and the API is same-origin.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
