worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Production only: behind the TLS proxy (Caddy) every connection comes from the proxy, so the
    # /auth rate limit would see ONE client. deploy/realip.conf restores the real client IP from
    # X-Forwarded-For. A wildcard include does not fail when nothing matches: no-op in development.
    include /etc/nginx/realip/*.conf;

    # Docker's embedded DNS. Using a resolver together with `set $upstream ...; proxy_pass $upstream;`
    # makes nginx look the service up at REQUEST time. Plain `proxy_pass http://name` would resolve
    # once at startup, and nginx would refuse to start (or keep a stale IP) if a service is down
    # or restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- request id ------------------------------------------------------------------------
    # Keep the caller's X-Request-ID if it looks sane (letters, digits . _ -, at most 64 chars);
    # otherwise use nginx's own random $request_id. Without this check a client could stuff
    # arbitrary text into every log line of every service.
    map $http_x_request_id $incoming_request_id {
        "~^[A-Za-z0-9._-]{1,64}$"  $http_x_request_id;
        default                    "";
    }
    map $incoming_request_id $req_id {
        ""       $request_id;
        default  $incoming_request_id;
    }

    # One JSON object per line, with the request id so gateway logs can be joined with the services'.
    # $uri (not $request_uri): the query string stays out of the logs.
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"request_time":$request_time,"bytes_sent":$body_bytes_sent,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"}';

    # ---- rate limit for /auth/* ---------------------------------------------------------------
    # Per client IP (nobody is logged in yet at these routes): 30 requests per minute, plus a burst
    # of 10. Note: behind another proxy or load balancer, $remote_addr would be that proxy's address;
    # then restore the real client IP first (ngx_http_realip_module).
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 8080;
        access_log /dev/stdout json;
        error_log  /dev/stderr warn;

        client_max_body_size 64k;  # every request body in this API is a tiny JSON document

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;  # gateway -> service
        proxy_set_header X-Real-IP $remote_addr;
        # The client's own X-Forwarded-For is NOT trusted: at the edge we set it ourselves.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        # The services echo the id too; hide theirs so the client gets exactly one header.
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $req_id always;
        add_header X-Content-Type-Options nosniff always;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location ~ ^/auth(/|$) {
            limit_req zone=auth_per_ip burst=10 nodelay;
            error_page 429 @rate_limited;
            set $upstream http://auth-service:8000;
            proxy_pass $upstream;
        }

        location ~ ^/(wallets|transfers|admin)(/|$) {
            set $upstream http://wallet-service:8000;
            proxy_pass $upstream;
        }

        location ~ ^/notifications(/|$) {
            set $upstream http://notification-service:8000;
            proxy_pass $upstream;
        }

        # /metrics, /docs and every other path are deliberately NOT routed: metrics are for
        # Prometheus inside the Docker network only.
        location / {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"Unknown route"}}';
        }

        location @rate_limited {
            default_type application/json;
            add_header X-Request-ID $req_id always;  # add_header in a location replaces the inherited ones
            add_header Retry-After 2 always;
            return 429 '{"error":{"code":"rate_limited","message":"Too many requests, slow down"}}';
        }
    }
}
