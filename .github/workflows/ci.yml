name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/*/requirements-dev.txt
      - run: pip install "ruff>=0.8"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth-service, db: auth_test_db }
          - { service: wallet-service, db: wallet_test_db }
          - { service: notification-service, db: notification_test_db }
    # Real Postgres, Redis and RabbitMQ: the integration tests need the real servers, not mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          # Not the default guest user: guest may only log in from localhost INSIDE the container.
          RABBITMQ_DEFAULT_USER: wallet
          RABBITMQ_DEFAULT_PASS: wallet
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    env:
      TEST_DATABASE_URL: postgresql://wallet:wallet@localhost:5432/${{ matrix.db }}
      TEST_RABBITMQ_URL: amqp://wallet:wallet@localhost:5672/
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - name: Run unit and integration tests
        working-directory: services/${{ matrix.service }}
        run: pytest -ra

  scripts-and-config:
    name: scripts, compose files, nginx
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests of the helper scripts
        run: python -m unittest discover -s scripts/tests -v
      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh deploy/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done
      - name: Compose files are valid
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile loadtest -f docker-compose.yml -f docker-compose.loadtest.yml config -q
          DOMAIN=example.com ACME_EMAIL=ops@example.com \
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config -q
      - name: nginx config is valid (development and production variants)
        run: |
          docker run --rm -v "$PWD/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm -v "$PWD/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/realip.conf:/etc/nginx/realip/realip.conf:ro" \
            nginx:1.27-alpine nginx -t

  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, wallet-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: wallet-platform/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  frontend:
    name: frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `npm ci` once a package-lock.json is committed (reproducible); `npm install` until then.
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  docker-build-frontend:
    name: docker build (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: wallet-platform/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
