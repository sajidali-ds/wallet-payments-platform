# Mounted into the gateway ONLY by deploy/docker-compose.prod.yml (see the include in gateway/nginx.conf).
# Trust X-Forwarded-For only when the connection comes from Docker's private ranges, i.e. from Caddy.
# Anyone on the internet reaches Caddy, never nginx directly, and Caddy overwrites a client-supplied
# X-Forwarded-For with the real peer address.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
